            - cell "Google peut traiter des données hors UE (États-Unis). Transferts encadrés par le Data Privacy Framework et/ou des clauses contractuelles types" [ref=e162]
          - row [ref=e163]:
            - cell "Google (Analytics)" [ref=e164]
            - cell "Mesure d'audience, uniquement après consentement" [ref=e165]
            - cell "Idem" [ref=e166]
          - row [ref=e167]:
            - cell "Algolia" [ref=e168]
            - cell "Moteur de recherche d'annonces" [ref=e169]
            - cell "Europe" [ref=e170]
          - row [ref=e171]:
            - cell "Mailjet" [ref=e172]
            - cell "Envoi des emails" [ref=e173]
            - cell "Union européenne" [ref=e174]
          - row [ref=e175]:
            - cell "Vercel" [ref=e176]
            - cell "Hébergement du Site et des données" [ref=e177]
            - cell "États-Unis (transferts encadrés par le Data Privacy Framework et/ou les clauses contractuelles types)" [ref=e178]
      - paragraph [ref=e179]: Nous pouvons être amenés à communiquer vos données aux autorités administratives ou judiciaires lorsque la loi l'exige.
      - heading "6. Sécurité" [level=2] [ref=e180]
      - paragraph [ref=e181]: Nous mettons en œuvre des mesures techniques et organisationnelles adaptées pour protéger vos données (accès restreints, chiffrement des mots de passe, connexions sécurisées, etc. ). Aucune mesure n'étant infaillible, nous ne pouvons garantir une sécurité absolue. Il vous appartient de garder votre mot de passe confidentiel.
      - paragraph [ref=e182]: En cas de violation de données susceptible d'engendrer un risque pour vos droits, nous en informerons la CNIL dans les 72 heures et, si le risque est élevé, les personnes concernées.
      - heading "7. Vos droits" [level=2] [ref=e183]
      - paragraph [ref=e184]: "Vous disposez des droits suivants : accès, rectification, effacement, limitation, opposition, portabilité, retrait du consentement à tout moment, et définition de directives sur le sort de vos données après votre décès."
      - paragraph [ref=e185]:
        - text: Pour les exercer, écrivez à
        - link "contact@leschouxdacote.fr" [ref=e186] [cursor=pointer]:
          - /url: mailto:contact@leschouxdacote.fr
        - text: en précisant votre demande. Nous pouvons vous demander un justificatif d'identité en cas de doute raisonnable.
      - paragraph [ref=e187]:
        - text: "Si vous estimez que vos droits ne sont pas respectés, vous pouvez introduire une réclamation auprès de la CNIL :"
        - link "cnil.fr/fr/plaintes" [ref=e188] [cursor=pointer]:
          - /url: https://www.cnil.fr/fr/plaintes
        - text: .
      - heading "8. Mineurs" [level=2] [ref=e189]
      - paragraph [ref=e190]: Le Site s'adresse aux personnes majeures. Il n'est pas destiné aux moins de 18 ans.
      - heading "9. Modification de la Charte" [level=2] [ref=e191]
      - paragraph [ref=e192]: Nous pouvons modifier cette Charte. La date de dernière mise à jour figure en haut de page.
