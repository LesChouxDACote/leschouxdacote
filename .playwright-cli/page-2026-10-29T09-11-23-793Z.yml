      - paragraph [ref=e129]: Nous ne demandons pas de données dites « sensibles » (origine, opinions politiques ou religieuses, santé…). Nous vous invitons à ne pas en saisir dans les champs libres (annonces, messages).
      - heading "3. Mise en relation entre utilisateurs" [level=2] [ref=e130]
      - paragraph [ref=e131]: "Le but du Site est de vous mettre en contact avec d'autres utilisateurs. À ce titre, certaines de vos données sont visibles par d'autres personnes :"
      - list [ref=e132]:
        - listitem [ref=e133]: "Visibles publiquement avec votre annonce : prénom, ville, contenu de l'annonce, etc."
        - listitem [ref=e134]: "Visibles uniquement par les utilisateurs connectés, ou transmises lors d’une réservation : ex. email, téléphone."
      - paragraph [ref=e135]: Vous choisissez les informations que vous publiez. Nous vous recommandons de ne pas diffuser plus de coordonnées que nécessaire. Une fois vos coordonnées transmises à un autre utilisateur, celui-ci devient responsable de l'usage qu'il en fait. Nous ne maîtrisons pas cet usage.
      - heading "4. Cookies et mesure d'audience" [level=2] [ref=e136]
      - paragraph [ref=e137]: Un cookie est un petit fichier déposé sur votre appareil lors de la visite d'un site.
      - list [ref=e138]:
        - listitem [ref=e139]: "Cookies strictement nécessaires : ils permettent la connexion à votre compte et la sécurité du Site. Ils ne nécessitent pas votre accord."
        - listitem [ref=e140]: "Cookies de mesure d'audience (Google Analytics) : nous utilisons Google Analytics, un service de Google, pour savoir comment le Site est utilisé. Ces cookies ne sont déposés qu'avec votre consentement."
      - paragraph [ref=e141]: À votre première visite, un bandeau vous permet d'accepter ou de refuser ces cookies, avec la même facilité. Votre refus n'empêche pas l'utilisation du Site.
      - paragraph [ref=e142]: Vous pouvez modifier votre choix à tout moment grâce au bouton « Modifier mon choix » ci-dessous.
      - paragraph [ref=e143]:
        - button "Modifier mon choix" [ref=e144] [cursor=pointer]
      - paragraph [ref=e145]: Votre choix est conservé 6 à 13 mois, puis nous vous le redemanderons. Les cookies durent 13 mois au maximum.
      - paragraph [ref=e146]: Les données recueillies par Google Analytics sont transmises à Google (voir section 5).
      - paragraph [ref=e147]:
        - text: "Plus d'informations :"
        - link "cnil.fr/fr/cookies-et-autres-traceurs" [ref=e148] [cursor=pointer]:
          - /url: https://www.cnil.fr/fr/cookies-et-autres-traceurs
        - text: .
      - heading "5. Qui reçoit vos données ?" [level=2] [ref=e149]
      - paragraph [ref=e150]: "Vos données ne sont pas vendues. Elles sont accessibles uniquement à l'Éditeur et aux prestataires techniques suivants, qui les traitent pour notre compte :"
