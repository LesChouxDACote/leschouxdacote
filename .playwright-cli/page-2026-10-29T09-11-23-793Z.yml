    - main [ref=e59]:
      - heading "Charte de respect de la vie privée – leschouxdacote.fr" [level=1] [ref=e60]
      - paragraph [ref=e61]: "Dernière mise à jour : 27 octobre 2026."
      - heading "1. Qui sommes-nous ?" [level=2] [ref=e62]
      - paragraph [ref=e63]: Le site leschouxdacote.fr (le « Site ») permet à des producteurs de produits alimentaires et à des acheteurs de se trouver et de se mettre en relation directement, sans intermédiaire.
      - paragraph [ref=e64]: Le Site est édité à titre personnel et non professionnel par Anthony NGUYEN (l'« Éditeur »), qui est le responsable du traitement de vos données personnelles.
      - paragraph [ref=e65]:
        - text: "Contact :"
        - link "contact@leschouxdacote.fr" [ref=e66] [cursor=pointer]:
          - /url: mailto:contact@leschouxdacote.fr
      - paragraph [ref=e67]: Aucun délégué à la protection des données (DPO) n'a été désigné. Toute question sur vos données peut être adressée à l'adresse ci-dessus.
      - paragraph [ref=e68]:
        - text: Cette Charte s'applique avec les
        - link "Conditions Générales d'Utilisation" [ref=e69] [cursor=pointer]:
          - /url: /cgu
        - text: . Elle respecte le Règlement général sur la protection des données (RGPD) et la loi Informatique et Libertés.
