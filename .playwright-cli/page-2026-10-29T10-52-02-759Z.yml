      - generic [ref=e61]:
        - heading "À propos" [level=1] [ref=e62]
        - heading "D'où vient l'idée Les Choux d'à Côté ?" [level=2] [ref=e63]
        - paragraph [ref=e64]: En septembre 2020, Anthony a vu un documentaire montrant que des pêcheurs de Porto Rico indiquaient dans une application mobile leur pêche du jour. Les restaurateurs utilisant ce service pouvaient contacter directement les pêcheurs afin d'acheter leurs produits.
        - paragraph [ref=e65]: L'idée était née ! Un site d'annonces alimentaires, voilà le chaînon qu'il manquait pour rapprocher les producteurs et acheteurs d'un même territoire.
        - paragraph [ref=e66]: "Au fil de ses recherches et entretiens autour du circuit court, Anthony a constaté plusieurs points :"
        - generic [ref=e67]:
          - generic [ref=e68]:
            - heading "Les producteurs" [level=3] [ref=e69]
            - paragraph [ref=e70]: "La vente à la ferme et le marché sont les principaux modes de commercialisation en circuit court : de la vente directe, sans intermédiaire. Pourtant, pour gagner en visibilité, beaucoup de producteurs se tournent vers des marketplaces qui imposent leurs règles."
            - paragraph [ref=e71]:
              - emphasis [ref=e72]: Ce qu'il manque, c'est un service de diffusion d'annonces alimentaires, pour mettre en avant ses produits, élargir son réseau en toute autonomie et vendre en direct.
          - generic [ref=e73]:
            - heading "Les acheteurs professionnels" [level=3] [ref=e74]
            - paragraph [ref=e75]: Les acheteurs professionnels cherchent à acheter en grande quantité des produits de qualité. Ils veulent pouvoir comparer les offres, négocier et rencontrer les producteurs, ce que la vente en ligne ne permet pas.
            - paragraph [ref=e76]:
              - emphasis [ref=e77]: Ce qu'il manque, c'est un site de mise en relation directe et flexible, qui n'impose pas de moyen de paiement ni de livraison.
          - generic [ref=e78]:
            - heading "Les particuliers" [level=3] [ref=e79]
            - paragraph [ref=e80]: Les particuliers sont de plus en plus nombreux à se tourner vers une consommation locale et responsable. Mais comment rencontrer les producteurs et découvrir leurs produits ?
            - paragraph [ref=e81]:
              - emphasis [ref=e82]: Ce qu'il manque, c'est une plateforme qui référence et géolocalise des produits, pour faciliter la recherche et acheter directement auprès du producteur.
        - paragraph [ref=e83]: La plateforme de vente directe Les Choux d'à Côté répond justement à toutes ces problématiques !
        - paragraph [ref=e84]:
