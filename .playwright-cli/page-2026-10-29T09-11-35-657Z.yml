    - main [ref=f2e59]:
      - heading "Conditions générales d’utilisation – leschouxdacote.fr" [level=1] [ref=f2e60]
      - paragraph [ref=f2e61]: "Dernière mise à jour : 29 octobre 2026."
      - heading "1. Objet" [level=2] [ref=f2e62]
      - paragraph [ref=f2e63]: Le site leschouxdacote.fr (le « Site ») permet à des producteurs de produits alimentaires de publier des annonces et à des acheteurs de les trouver, de les réserver et de contacter directement les producteurs, sans intermédiaire.
      - paragraph [ref=f2e64]: Le Site est édité à titre personnel et non professionnel par Anthony NGUYEN (l’« Éditeur »). Son utilisation est gratuite.
      - paragraph [ref=f2e65]:
        - text: "Les présentes Conditions Générales d’Utilisation (les « CGU ») fixent les règles d’utilisation du Site. Contact :"
        - link "contact@leschouxdacote.fr" [ref=f2e66] [cursor=pointer]:
          - /url: mailto:contact@leschouxdacote.fr
      - heading "2. Acceptation des CGU" [level=2] [ref=f2e67]
      - paragraph [ref=f2e68]: La consultation des annonces est libre. La création d’un compte vaut acceptation des CGU dans leur version en vigueur. Si vous ne les acceptez pas, ne créez pas de compte.
      - heading "3. Comptes" [level=2] [ref=f2e69]
      - paragraph [ref=f2e70]: "Deux types de comptes existent :"
      - list [ref=f2e71]:
        - listitem [ref=f2e72]: "Compte producteur : réservé aux professionnels qui vendent les produits qu’ils produisent ou transforment. Il demande un numéro SIRET, un nom commercial, une adresse, une description de l’activité et un numéro de téléphone."
        - listitem [ref=f2e73]: "Compte acheteur : il permet de suivre des producteurs, de recevoir des alertes et de réserver des produits."
      - paragraph [ref=f2e74]: "Le Site est réservé aux personnes majeures. Vous vous engagez à fournir des informations exactes et à les tenir à jour. Votre mot de passe est personnel : gardez-le confidentiel. Toute action réalisée depuis votre compte est réputée faite par vous."
      - heading "4. Annonces" [level=2] [ref=f2e75]
      - paragraph [ref=f2e76]: "Le producteur est seul responsable des annonces qu’il publie. Il s’engage à :"
      - list [ref=f2e77]:
        - listitem [ref=f2e78]: ne proposer que des produits alimentaires qu’il produit ou transforme lui-même ;
        - listitem [ref=f2e79]: respecter la réglementation applicable à ses produits, notamment les règles d’hygiène, de traçabilité, d’étiquetage et d’information sur les prix ;
        - listitem [ref=f2e80]: décrire ses produits de façon exacte et loyale (nature, quantité, prix, lieu et créneaux de retrait) ;
        - listitem [ref=f2e81]: ne publier que des textes et des photos dont il détient les droits.
      - paragraph [ref=f2e82]: "Une annonce a une durée de validité limitée : à sa date d’expiration, elle n’est plus visible. Le producteur peut être prévenu par e-mail et la remettre en ligne depuis son compte."
      - paragraph [ref=f2e83]: L’Éditeur peut retirer, sans préavis, une annonce illicite, trompeuse ou contraire aux CGU ou à l’objet du Site.
      - heading "5. Réservations" [level=2] [ref=f2e84]
      - paragraph [ref=f2e85]: Lorsqu’un producteur l’a prévu, l’acheteur peut réserver une quantité d’un produit sur un créneau de retrait, dans la limite des quantités disponibles. Ses prénom, nom, adresse e-mail et numéro de téléphone sont alors transmis au producteur, qui est prévenu par e-mail.
      - paragraph [ref=f2e86]: L’acheteur peut modifier ou annuler sa réservation jusqu’à la fin du créneau. Le producteur peut ajuster la quantité réservée ; il en informe lui-même l’acheteur.
      - paragraph [ref=f2e87]: Une réservation n’est pas un paiement. Le paiement et la remise des produits se font directement entre le producteur et l’acheteur, en dehors du Site. L’Éditeur n’est pas partie à la vente et n’intervient pas dans son exécution. Le producteur et l’acheteur s’engagent à honorer les réservations ou à prévenir l’autre partie dans les meilleurs délais.
      - heading "6. Alertes et producteurs suivis" [level=2] [ref=f2e88]
      - paragraph [ref=f2e89]: Vous pouvez suivre des producteurs et recevoir un e-mail lors de leurs nouvelles annonces. Ces alertes, comme celles qui préviennent un producteur de l’expiration de ses annonces, se désactivent à tout moment depuis la page « Mes alertes » de votre compte.
      - heading "7. Responsabilités" [level=2] [ref=f2e90]
      - paragraph [ref=f2e91]: Pour les annonces et les informations publiées par les utilisateurs, l’Éditeur agit en tant qu’hébergeur au sens de la loi n° 2004-575 du 21 juin 2004 pour la confiance dans l’économie numérique (LCEN). Il ne contrôle pas ces contenus avant leur publication. Il ne garantit ni la qualité, ni la conformité, ni la disponibilité des produits proposés.
      - paragraph [ref=f2e92]: L’Éditeur s’efforce de rendre le Site accessible, sans pouvoir le garantir en permanence. Il peut l’interrompre, notamment pour maintenance, sans que sa responsabilité puisse être engagée.
      - paragraph [ref=f2e93]: Chaque utilisateur est responsable de l’usage qu’il fait du Site et des coordonnées des autres utilisateurs. Il s’interdit tout usage illicite, frauduleux ou contraire à l’objet du Site (démarchage, spam, collecte automatisée de données…).
      - heading "8. Signaler un contenu" [level=2] [ref=f2e94]
      - paragraph [ref=f2e95]:
        - text: Pour signaler une annonce ou un contenu illicite, écrivez à
        - link "contact@leschouxdacote.fr" [ref=f2e96] [cursor=pointer]:
          - /url: mailto:contact@leschouxdacote.fr
        - text: en indiquant l’adresse de la page concernée et la raison de votre signalement. L’Éditeur le traitera dans les meilleurs délais.
      - heading "9. Suspension et suppression du compte" [level=2] [ref=f2e97]
      - paragraph [ref=f2e98]: L’Éditeur peut suspendre ou supprimer un compte en cas de manquement aux CGU, après avoir, sauf urgence, invité l’utilisateur à s’expliquer.
      - paragraph [ref=f2e99]:
        - text: Vous pouvez demander la suppression de votre compte à tout moment en écrivant à
        - link "contact@leschouxdacote.fr" [ref=f2e100] [cursor=pointer]:
          - /url: mailto:contact@leschouxdacote.fr
        - text: . Vos annonces et vos données sont alors supprimées, dans les conditions prévues par la charte.
      - heading "10. Données personnelles" [level=2] [ref=f2e101]
      - paragraph [ref=f2e102]:
        - text: Le traitement de vos données personnelles et l’usage des cookies sont décrits dans
        - link "notre charte de respect de la vie privée" [ref=f2e103] [cursor=pointer]:
          - /url: /charte
        - text: .
      - heading "11. Propriété intellectuelle" [level=2] [ref=f2e104]
      - paragraph [ref=f2e105]: Le Site, sa présentation et ses éléments propres (nom, logo, textes, mise en page) appartiennent à l’Éditeur. Leur reproduction sans autorisation est interdite.
      - paragraph [ref=f2e106]: Le producteur conserve ses droits sur les textes et photos de ses annonces. Il autorise l’Éditeur à les afficher gratuitement sur le Site, pendant la durée de leur publication, pour les besoins de son fonctionnement.
      - heading "12. Modification des CGU" [level=2] [ref=f2e107]
      - paragraph [ref=f2e108]: L’Éditeur peut modifier les CGU. La date de dernière mise à jour figure en haut de page. Continuer à utiliser le Site après une modification vaut acceptation des nouvelles CGU.
      - heading "13. Droit applicable" [level=2] [ref=f2e109]
      - paragraph [ref=f2e110]:
        - text: Les CGU sont soumises au droit français. En cas de litige, une solution amiable sera recherchée en priorité, en écrivant à
        - link "contact@leschouxdacote.fr" [ref=f2e111] [cursor=pointer]:
          - /url: mailto:contact@leschouxdacote.fr
        - text: . À défaut, les tribunaux français seront compétents.
